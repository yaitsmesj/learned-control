[project]
name = "learned-control"
version = "0.1.0"
description = "Learned Control: RL and imitation in simulation, from scratch to mjlab to ROS 2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "gymnasium[classic-control]==1.3.0",
    "mujoco==3.11.0",
    "numpy",
    "matplotlib",
    "onnx",
    "onnxruntime",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
